apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-cicd
  labels:
    app: calculator-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator-cicd
  template:
    metadata:
      labels:
        app: calculator-cicd
    spec:
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
